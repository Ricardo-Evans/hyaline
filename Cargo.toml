[package]
name = "hyaline"
version = "0.1.0"
description = "A safe and efficient deferred resource reclamation library for concurrent scenarios, powered by the Hyaline-1 algorithm."
edition = "2024"
license-file = "LICENSE"
readme = "README.md"
repository = "https://github.com/Ricardo-Evans/hyaline"
keywords = ["garbage", "lock-free", "rcu", "reclamation", "smr"]
categories = ["concurrency", "memory-management"]

[features]
_loom = ["dep:derive_more", "dep:loom"]

[profile.bench]
debug = "full"

[[bench]]
name = "pin"
harness = false

[dev-dependencies]
criterion = "0.8.2"
crossbeam-epoch = "0.9.21"
seize = "0.5.1"

[dependencies]
crossbeam-utils = "0.8.23"
derive_more = { version = "2.1.1", features = ["full"], optional = true }
loom = { version = "0.7.2", optional = true }
parking_lot = "0.13.0"
